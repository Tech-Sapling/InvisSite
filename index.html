<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    background: #090e21;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    scrollbar-width: none; -ms-overflow-style: none; overflow-x: hidden;
}
body::-webkit-scrollbar { display: none; }
:root {
    --bg-card:    #121b40;
    --bg-sidebar: #0e1736;
    --bg-header:  #0d1530;
    --text-dim:   #7a8bb5;
    --green:      #00e676;
    --accent:     #4f7cff;
    --ease: cubic-bezier(.4,0,.2,1);
    --sidebar-w:  210px;
    --sidebar-col: 52px;
    --page-pad: 28px;
    --page-max: 1440px;
}

/* ── PAGE WRAPPER ─────────────────────────────────────── */
#page-root {
    max-width: var(--page-max);
    margin: 0 auto;
    padding: 22px var(--page-pad) var(--page-pad);
}

.layout { display: flex; align-items: flex-start; }
.main   { flex: 1; min-width: 0; }
.left-col { display: flex; flex-direction: column; gap: 12px; margin-right: 18px; position: sticky; top: 22px; flex-shrink: 0; width: var(--sidebar-w); transition: width .32s var(--ease); }

/* ── ANNOUNCE ─────────────────────────────────────────── */
.announce-box { background: var(--bg-sidebar); border-radius: 14px; border: 1px solid rgba(79,124,255,0.2); overflow: hidden; animation: fadeUp .4s var(--ease) both; }
.announce-header { display: flex; align-items: center; gap: 6px; padding: 10px 14px 6px; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #4f7cff; border-bottom: 1px solid rgba(79,124,255,0.12); }
.announce-msg { padding: 10px 14px; font-size: 12.5px; font-weight: 500; color: #c5d0f0; line-height: 1.55; }
.poll-options { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px; }
.poll-btn { width: 100%; padding: 8px 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; font-weight: 700; font-family: inherit; text-align: left; background: rgba(79,124,255,0.1); color: #a0b4ff; border: 1px solid rgba(79,124,255,0.2); transition: background .2s, color .2s, border-color .2s; position: relative; overflow: hidden; }
.poll-btn:hover { background: rgba(79,124,255,0.2); color: #fff; border-color: rgba(79,124,255,0.4); }
.poll-btn.voted { background: rgba(79,124,255,0.25); color: #fff; border-color: var(--accent); cursor: default; }
.poll-bar { position: absolute; left: 0; top: 0; height: 100%; background: rgba(79,124,255,0.15); z-index: 0; transition: width .5s var(--ease); }
.poll-btn-label { position: relative; z-index: 1; display: flex; justify-content: space-between; }
.poll-pct { font-size: 11px; opacity: .8; }

/* ── SIDEBAR ──────────────────────────────────────────── */
.sidebar { width: var(--sidebar-w); min-width: var(--sidebar-w); background: var(--bg-sidebar); border-radius: 14px; transition: width .32s var(--ease), min-width .32s var(--ease); flex-shrink: 0; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
.sidebar.collapsed { width: var(--sidebar-col); min-width: var(--sidebar-col); }
.sidebar-toggle { display: flex; align-items: center; justify-content: space-between; padding: 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06); transition: background .2s; white-space: nowrap; user-select: none; }
.sidebar-toggle:hover { background: rgba(79,124,255,0.08); }
.sidebar-toggle-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; transition: opacity .2s; }
.sidebar.collapsed .sidebar-toggle-label { opacity: 0; }
.toggle-arrow { width: 20px; height: 20px; flex-shrink: 0; color: var(--text-dim); display: flex; align-items: center; justify-content: center; transition: transform .3s var(--ease); }
.sidebar.collapsed .toggle-arrow { transform: rotate(180deg); }
.genre-list { padding: 8px 0; }
.genre-item { display: flex; align-items: center; gap: 11px; padding: 11px 14px; cursor: pointer; border-left: 3px solid transparent; transition: background .2s, border-color .2s; white-space: nowrap; overflow: hidden; position: relative; user-select: none; }
.genre-item:hover { background: rgba(79,124,255,0.1); }
.genre-item.active { background: rgba(79,124,255,0.18); border-left-color: var(--accent); }
.genre-icon { width: 26px; height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.genre-icon svg { width: 16px; height: 16px; fill: none; stroke: var(--text-dim); color: var(--text-dim); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .2s, color .2s; }
.genre-item.active .genre-icon svg, .genre-item:hover .genre-icon svg { stroke: #fff; color: #fff; }
.genre-label { font-size: 13px; font-weight: 600; color: var(--text-dim); transition: color .2s, opacity .2s; }
.genre-item.active .genre-label, .genre-item:hover .genre-label { color: #fff; }
.sidebar.collapsed .genre-label { opacity: 0; pointer-events: none; }
.sidebar.collapsed .genre-item:hover::after { content: attr(data-label); position: absolute; left: calc(var(--sidebar-col) + 8px); top: 50%; transform: translateY(-50%); background: #1a2760; color: #fff; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; white-space: nowrap; z-index: 999; box-shadow: 0 6px 20px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.08); pointer-events: none; }

/* ── SEARCH ───────────────────────────────────────────── */
.search-wrap { position: relative; margin-bottom: 20px; animation: fadeDown .4s var(--ease) both; }
.search-input { width: 100%; background: var(--bg-card); border: 1.5px solid rgba(255,255,255,0.07); border-radius: 12px; color: #fff; font-size: 14px; font-family: inherit; padding: 13px 18px 13px 48px; outline: none; transition: border-color .25s, box-shadow .25s; }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,124,255,0.15); }
.search-input::placeholder { color: #44445a; }
.search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: .35; transition: opacity .2s; }
.search-icon svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
.search-wrap:focus-within .search-icon { opacity: .85; }

/* ── SECTIONS & HEADERS ───────────────────────────────── */
.section { margin-bottom: 32px; }
.section-header { margin-bottom: 14px; }
.header-content { position: relative; width: 100%; height: 52px; background: var(--bg-header); overflow: hidden; display: flex; align-items: center; border-radius: 10px; border-left: 4px solid var(--accent); }
.header-img { position: absolute; top: 0; right: 0; width: 75%; height: 100%; object-fit: cover; opacity: .75; mask-image: linear-gradient(to right, transparent 0%, black 45%); -webkit-mask-image: linear-gradient(to right, transparent 0%, black 45%); }
.header-overlay { position: absolute; inset: 0; background: linear-gradient(to right, var(--bg-header) 18%, rgba(13,21,48,0.3) 60%, transparent 100%); z-index: 2; }
.header-badge { position: relative; z-index: 3; margin-left: 18px; display: flex; align-items: center; gap: 10px; }
.header-title { font-size: 15px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 2.5px; }
.header-pill { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 3px 9px; border-radius: 20px; background: rgba(79,124,255,0.2); color: #7da4ff; border: 1px solid rgba(79,124,255,0.3); }

/* ── GRIDS ────────────────────────────────────────────── */
.grid-foryou { display: grid; grid-template-columns: 1.65fr 1fr 1fr; grid-template-rows: auto auto; gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.hero-left { grid-column: 1; grid-row: 1 / 3; }
.grid-mixed { display: grid; grid-template-columns: repeat(3,1fr); grid-auto-flow: dense; gap: 10px; }
.wide-card { grid-column: span 2; }
.tall-card { grid-row: span 2; }

/* ── GAME CARDS ───────────────────────────────────────── */
.game-card { display: flex; flex-direction: column; cursor: pointer; background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,0.04); padding: 0; text-align: left; width: 100%; height: 100%; transition: transform .28s var(--ease), border-color .28s var(--ease), box-shadow .28s var(--ease); animation: fadeUp .38s var(--ease) both; }
.game-card:hover { transform: translateY(-5px) scale(1.013); border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,124,255,0.35), 0 24px 48px rgba(0,0,0,0.55), 0 0 36px rgba(79,124,255,0.18); }
.game-card:active { transform: translateY(-2px) scale(1.005); }
.game-card .image-box { flex: 1; }
.hero-left .image-box, .tall-card .image-box { position: relative; width: 100%; height: 100%; min-height: 260px; }
.small .image-box, .g3-card .image-box, .g4-card .image-box, .genre-card .image-box, .wide-card .image-box { position: relative; width: 100%; padding-top: 58%; }
.game-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .55s var(--ease); }
.game-card:hover .game-img { transform: scale(1.08); }
.overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(9,14,40,1) 0%, rgba(9,14,40,0.72) 28%, rgba(9,14,40,0.08) 58%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; transition: background .28s; }
.game-card:hover .overlay { background: linear-gradient(to top, rgba(9,14,40,1) 0%, rgba(9,14,40,0.82) 32%, rgba(9,14,40,0.1) 62%, transparent 100%); }

/* Crown */
.crown-badge { position: absolute; top: 10px; right: 10px; z-index: 10; display: flex; align-items: center; gap: 5px; background: linear-gradient(135deg, rgba(255,180,0,0.22), rgba(255,120,0,0.18)); border: 1px solid rgba(255,190,0,0.45); border-radius: 20px; padding: 4px 9px 4px 6px; backdrop-filter: blur(6px); box-shadow: 0 0 14px rgba(255,160,0,0.25); animation: crownPop .4s cubic-bezier(.4,0,.2,1) both; }
.crown-badge svg { width: 13px; height: 13px; flex-shrink: 0; filter: drop-shadow(0 0 4px rgba(255,200,0,0.6)); }
.crown-badge span { font-size: 10px; font-weight: 900; letter-spacing: .8px; text-transform: uppercase; color: #ffd54f; line-height: 1; }
@keyframes crownPop { from{opacity:0;transform:scale(0.7) translateY(-4px)} to{opacity:1;transform:scale(1) translateY(0)} }

/* Like status */
.status-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.like-heart { position: relative; flex-shrink: 0; font-size: 0; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }
.like-heart svg { width: 13px; height: 13px; fill: var(--accent); position: relative; z-index: 1; }
.like-heart::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; background: var(--accent); opacity: 0; animation: heartpulse 2.4s ease-out infinite; }
@keyframes heartpulse { 0%{transform:scale(0.6);opacity:.5} 70%{transform:scale(2.2);opacity:0} 100%{transform:scale(2.2);opacity:0} }
.like-text { color: #7da4ff; font-size: 11px; font-weight: 700; letter-spacing: .4px; }

/* Titles */
.hero-left .title, .tall-card .title { font-size: 26px; font-weight: 900; color: #fff; line-height: 1.1; text-shadow: 0 2px 14px rgba(0,0,0,0.8); }
.small .title, .g3-card .title, .g4-card .title, .genre-card .title, .wide-card .title { font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.8); }

/* Genre view */
.genre-view-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.genre-view-icon-wrap { width: 44px; height: 44px; border-radius: 10px; background: rgba(79,124,255,0.15); border: 1px solid rgba(79,124,255,0.25); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.genre-view-title { font-size: 22px; font-weight: 900; color: #fff; }
.genre-view-count { font-size: 12px; color: var(--text-dim); margin-top: 2px; font-weight: 500; }

/* Empty state */
.empty-state { text-align: center; padding: 60px 0; color: var(--text-dim); }
.empty-icon { margin-bottom: 14px; }
.empty-icon svg { width: 38px; height: 38px; fill: none; stroke: #33334a; stroke-width: 1.5; stroke-linecap: round; }
.empty-state p { font-size: 14px; font-weight: 500; }

/* ── BASE ANIMATIONS ─────────────────────────────────── */
@keyframes fadeUp   { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
.anim-section { animation: fadeUp .42s var(--ease) both; }

/* ═══════════════════════════════════════════════════════
   GAME OVERLAY  —  ENTER + EXIT ANIMATIONS
   ═══════════════════════════════════════════════════════ */
#game-overlay {
    display: none; position: fixed; inset: 0; z-index: 9000;
    background: #090e21; flex-direction: column;
}
#game-overlay.active { display: flex; }

/* Slide up + fade + unblur on enter */
@keyframes overlayEnter {
    from { opacity: 0; transform: translateY(40px) scale(0.982); filter: blur(8px); }
    to   { opacity: 1; transform: translateY(0)    scale(1);     filter: blur(0);   }
}
/* Slide down + fade + blur + shrink on exit */
@keyframes overlayExit {
    0%   { opacity: 1; transform: translateY(0)    scale(1);     filter: blur(0);   }
    20%  { opacity: 1; transform: translateY(6px)  scale(0.997); filter: blur(0);   }
    100% { opacity: 0; transform: translateY(72px) scale(0.955); filter: blur(10px);}
}

#game-overlay.entering { animation: overlayEnter .38s var(--ease) both; }
#game-overlay.exiting  { animation: overlayExit  .4s  cubic-bezier(.4,0,1,1) both; pointer-events: none; }

/* ── GAME FRAME ───────────────────────────────────────── */
#game-frame-wrap { flex: 1; position: relative; overflow: hidden; background: #000; }
#game-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: #000; }

/* ── BOTTOM BAR ───────────────────────────────────────── */
#game-topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px; height: 54px; flex-shrink: 0;
    background: rgba(8,12,34,0.98);
    border-top: 1px solid rgba(79,124,255,0.14);
    transition: height .3s var(--ease), opacity .3s, padding .3s;
    overflow: hidden; order: 2;
    backdrop-filter: blur(12px);
}
#game-topbar.collapsed { height: 0; opacity: 0; pointer-events: none; }

.gbar-back { display: flex; align-items: center; gap: 6px; background: rgba(79,124,255,0.12); border: 1px solid rgba(79,124,255,0.25); color: #7da4ff; font-size: 12px; font-weight: 700; font-family: inherit; padding: 7px 13px; border-radius: 8px; cursor: pointer; flex-shrink: 0; transition: background .2s, transform .15s; }
.gbar-back:hover { background: rgba(79,124,255,0.22); transform: translateX(-2px); }
.gbar-back svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
.gbar-logo { height: 26px; width: auto; object-fit: contain; opacity: .9; flex-shrink: 0; }
.gbar-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.08); flex-shrink: 0; }
.gbar-name { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.9); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.gbar-btn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .2s, border-color .2s, color .2s, transform .15s; }
.gbar-btn:hover { background: rgba(255,255,255,0.09); color: #fff; transform: translateY(-1px); }
.gbar-btn.liked { background: rgba(79,124,255,0.18); border-color: rgba(79,124,255,0.4); color: #7da4ff; }
.gbar-btn.disliked { background: rgba(255,80,80,0.12); border-color: rgba(255,80,80,0.35); color: #ff6b6b; }
.gbar-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; flex-shrink: 0; }
.gbar-btn.icon-only { padding: 7px; }
.gbar-btn.icon-only svg { width: 15px; height: 15px; }

/* ── HIDE/SHOW PILL ───────────────────────────────────── */
#bar-toggle {
    position: absolute; bottom: 10px; right: 14px; z-index: 100;
    display: flex; align-items: center; gap: 5px;
    background: rgba(8,12,34,0.82); border: 1px solid rgba(79,124,255,0.22);
    border-radius: 20px; padding: 5px 11px 5px 8px;
    cursor: pointer; backdrop-filter: blur(10px);
    color: #7da4ff; font-size: 11px; font-weight: 700; font-family: 'Inter',sans-serif;
    opacity: 0.5; transition: opacity .2s, background .2s; user-select: none;
}
#bar-toggle:hover { opacity: 1; background: rgba(20,30,70,0.95); }
#bar-toggle svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; transition: transform .3s var(--ease); }
#bar-toggle.collapsed svg { transform: rotate(180deg); }
</style>
</head>
<body>

<!-- ═══ INLINE GAME PLAYER ═══ -->
<div id="game-overlay">
  <div id="game-frame-wrap">
    <div id="bar-toggle" onclick="toggleBar()">
      <svg viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9"/></svg>
      <span id="toggle-label">Hide bar</span>
    </div>
    <iframe id="game-iframe" src="about:blank" allowfullscreen allow="fullscreen *"></iframe>
  </div>
  <div id="game-topbar">
    <button class="gbar-back" onclick="closeGame()">
      <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>
      Back
    </button>
    <img class="gbar-logo" src="https://i.imgur.com/89sJzAy.png" alt="Logo" onerror="this.style.display='none'">
    <div class="gbar-divider"></div>
    <span class="gbar-name" id="gbar-name">Game</span>
    <div class="gbar-actions">
      <button class="gbar-btn" id="gbar-like" onclick="doVote('like')">
        <svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
        <span id="gbar-like-count">—</span>
      </button>
      <button class="gbar-btn" id="gbar-dis" onclick="doVote('dis')">
        <svg viewBox="0 0 24 24"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>
        <span id="gbar-dis-count">—</span>
      </button>
      <button class="gbar-btn" id="gbar-share" onclick="doShare()">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        <span id="gbar-share-label">Share</span>
      </button>
      <button class="gbar-btn icon-only" onclick="toggleFullscreen()" title="Fullscreen">
        <svg id="fs-icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ═══ MAIN LAYOUT (padded + max-width) ═══ -->
<div id="page-root">
<div class="layout">
<div class="left-col">
<div class="sidebar" id="sidebar">
  <div class="sidebar-toggle" onclick="toggleSidebar()">
    <span class="sidebar-toggle-label">Categories</span>
    <span class="toggle-arrow">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="12" height="12"><polyline points="8,2 4,6 8,10"/></svg>
    </span>
  </div>
  <div class="genre-list">
    <div class="genre-item active" data-label="All Games" onclick="setGenre('all',this)">
      <span class="genre-icon"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><line x1="8" y1="12" x2="12" y2="12"/><line x1="10" y1="10" x2="10" y2="14"/><circle cx="17" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="19.5" cy="13" r="1" fill="currentColor" stroke="none"/></svg></span>
      <span class="genre-label">All Games</span>
    </div>
    <div class="genre-item" data-label=".IO Games" onclick="setGenre('io',this)">
      <span class="genre-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-4 4-4 14 0 18M12 3c4 4 4 14 0 18"/></svg></span>
      <span class="genre-label">.IO Games</span>
    </div>
    <div class="genre-item" data-label="Shooter" onclick="setGenre('shooter',this)">
      <span class="genre-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="2" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="22"/></svg></span>
      <span class="genre-label">Shooter</span>

const HEARTBEAT_EXPIRY = 90000;
async function sweepStaleCounts() {
    const now = Date.now();
    for (const g of GAMES) {
        try {
            const snap = await getDoc(doc(db,'games',g.id));
            if (!snap.exists()) continue;
            const d = snap.data();
            if (!d.activePlayers || d.activePlayers <= 0) continue;
            const lb = d.lastHeartbeat?.toMillis?.();
            if (lb && (now - lb) > HEARTBEAT_EXPIRY) await updateDoc(doc(db,'games',g.id),{activePlayers:0});
        } catch(e) {}
    }
}
sweepStaleCounts();

let clickCounts    = {};
let likesCounts    = {};
let recentlyPlayed = JSON.parse(localStorage.getItem('is_recent') || '[]');
let currentGenre   = 'all';
let currentSearch  = '';
let loadedCount    = 0;
let activeGameId   = null;
let activeVote     = null;
let barCollapsed   = false;
let voteUnsub      = null;
let hbInterval     = null;

GAMES.forEach(g => {
    onSnapshot(doc(db,'games',g.id), snap => {
        clickCounts[g.id] = snap.exists() ? (snap.data().clicks || 0) : 0;
        likesCounts[g.id] = snap.exists() ? (snap.data().likes  || 0) : 0;
        if (loadedCount < GAMES.length) {
            loadedCount++;
            if (loadedCount === GAMES.length) renderAll();
            return;
        }
        document.querySelectorAll(`[data-likes="${g.id}"]`).forEach(el => {
            const n = likesCounts[g.id] || 0;
            const lbl = n >= 1000 ? (n/1000).toFixed(1)+'k' : n > 0 ? String(n) : '';
            el.textContent = lbl;
            const bar = el.closest('.status-bar');
            if (bar) bar.style.display = lbl ? 'flex' : 'none';
        });
    });
});

/* ── OPEN GAME ──────────────────────────────────────────── */
window.openGame = async (id) => {
    const game = GAMES.find(g => g.id === id);
    if (!game) return;
    activeGameId = id;
    activeVote   = localStorage.getItem('gvote_' + id) || null;
    barCollapsed = false;

    recentlyPlayed = [id,...recentlyPlayed.filter(i=>i!==id)].slice(0,8);
    localStorage.setItem('is_recent', JSON.stringify(recentlyPlayed));

    const sessionKey = 'playing_' + id;
    if (!sessionStorage.getItem(sessionKey)) {
        try {
            const ref = doc(db,'games',id);
            const snap = await getDoc(ref);
            if (!snap.exists()) await setDoc(ref,{clicks:1,activePlayers:1,lastHeartbeat:serverTimestamp()});
            else await updateDoc(ref,{clicks:increment(1),activePlayers:increment(1),lastHeartbeat:serverTimestamp()});
            sessionStorage.setItem(sessionKey,'1');
        } catch(e) {}
    }

    const overlay = document.getElementById('game-overlay');
    overlay.classList.remove('exiting');
    overlay.classList.add('active','entering');
    overlay.addEventListener('animationend', () => overlay.classList.remove('entering'), { once: true });

    document.body.style.overflow = 'hidden';
    document.getElementById('gbar-name').textContent = game.name;
    document.getElementById('game-iframe').src = game.url;

    const topbar = document.getElementById('game-topbar');
    const toggle = document.getElementById('bar-toggle');
    topbar.classList.remove('collapsed');
    toggle.classList.remove('collapsed');
    document.getElementById('toggle-label').textContent = 'Hide bar';

    clearInterval(hbInterval);
    const beat = async () => { try { await updateDoc(doc(db,'games',id),{lastHeartbeat:serverTimestamp()}); } catch(e){} };
    beat(); hbInterval = setInterval(beat, 30000);

    if (voteUnsub) voteUnsub();
    voteUnsub = onSnapshot(doc(db,'games',id), snap => {
        const d = snap.exists() ? snap.data() : {};
        document.getElementById('gbar-like-count').textContent = d.likes    || 0;
        document.getElementById('gbar-dis-count').textContent  = d.dislikes || 0;
        document.getElementById('gbar-like').classList.toggle('liked',    activeVote==='like');
        document.getElementById('gbar-dis').classList.toggle('disliked',  activeVote==='dis');
    });
};

/* ── CLOSE GAME with exit animation ────────────────────── */
window.closeGame = async () => {
    clearInterval(hbInterval);
    if (voteUnsub) { voteUnsub(); voteUnsub = null; }
    if (activeGameId) {
        try { await updateDoc(doc(db,'games',activeGameId),{activePlayers:increment(-1)}); } catch(e) {}
    }
    activeGameId = null;
    if (document.fullscreenElement) { try { await document.exitFullscreen(); } catch(e){} }

    const overlay = document.getElementById('game-overlay');
    overlay.classList.remove('entering');
    overlay.classList.add('exiting');

    // Wait for animation, then fully teardown
    overlay.addEventListener('animationend', () => {
        overlay.classList.remove('active','exiting');
        document.getElementById('game-iframe').src = 'about:blank';
        document.body.style.overflow = '';
    }, { once: true });
};

window.toggleBar = () => {
    barCollapsed = !barCollapsed;
    document.getElementById('game-topbar').classList.toggle('collapsed', barCollapsed);
    document.getElementById('bar-toggle').classList.toggle('collapsed', barCollapsed);
    document.getElementById('toggle-label').textContent = barCollapsed ? 'Show bar' : 'Hide bar';
};

window.toggleFullscreen = () => {
    const overlay = document.getElementById('game-overlay');
    if (!document.fullscreenElement) {
        overlay.requestFullscreen().catch(()=>{});
        document.getElementById('fs-icon').innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';
    } else {
        document.exitFullscreen().catch(()=>{});
    }
};
document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement)
        document.getElementById('fs-icon').innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
});

window.doVote = async (type) => {
    if (!activeGameId) return;
    const prev = activeVote;
    activeVote = prev === type ? null : type;
    localStorage.setItem('gvote_' + activeGameId, activeVote || '');
    document.getElementById('gbar-like').classList.toggle('liked',    activeVote==='like');
    document.getElementById('gbar-dis').classList.toggle('disliked',  activeVote==='dis');
    try {
        const delta = {};
        if (prev==='like')        delta.likes    = increment(-1);
        if (prev==='dis')         delta.dislikes = increment(-1);
        if (activeVote==='like')  delta.likes    = increment(1);
        if (activeVote==='dis')   delta.dislikes = increment(1);
        const ref = doc(db,'games',activeGameId);
        const snap = await getDoc(ref);
        if (!snap.exists()) await setDoc(ref,{likes:0,dislikes:0,...delta});
        else if (Object.keys(delta).length) await updateDoc(ref,delta);
    } catch(e) {}
};

window.doShare = () => {
    const url = 'https://sites.google.com/view/404-page-not-fetched/page';
    navigator.clipboard.writeText(url).then(() => {
        const lbl = document.getElementById('gbar-share-label');
        const btn = document.getElementById('gbar-share');
        lbl.textContent = 'Copied!';
        btn.style.borderColor = 'rgba(0,230,118,0.5)';
        btn.style.color = '#00e676';
        setTimeout(() => { lbl.textContent = 'Share'; btn.style.borderColor=''; btn.style.color=''; }, 2000);
    }).catch(() => window.prompt('Copy this link:', url));
};

document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('game-overlay').classList.contains('active') && !document.fullscreenElement)
        closeGame();
});

function mkCard(g, wrapCls, isTop=false) {
    const likes = likesCounts[g.id] || 0;
    const likeLabel = likes >= 1000 ? (likes/1000).toFixed(1)+'k' : likes > 0 ? likes : '';
    const crown = isTop ? `<div class="crown-badge"><svg viewBox="0 0 24 24" fill="none"><path d="M3 17L6 7L12 13L18 7L21 17H3Z" fill="#FFD700" stroke="#FFA000" stroke-width="1.2" stroke-linejoin="round"/><circle cx="3" cy="17" r="1.5" fill="#FFD700"/><circle cx="21" cy="17" r="1.5" fill="#FFD700"/><circle cx="12" cy="13" r="1.5" fill="#FFD700"/><line x1="3" y1="19" x2="21" y2="19" stroke="#FFA000" stroke-width="1.5" stroke-linecap="round"/></svg><span>Hot</span></div>` : '';
    return `<div class="${wrapCls}"><div class="game-card" onclick="openGame('${g.id}')"><div class="image-box">${crown}<img src="${g.img}" alt="${g.name}" class="game-img" loading="lazy"><div class="overlay"><div class="status-bar" style="${likeLabel?'':'display:none'}"><div class="like-heart"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><span class="like-text" data-likes="${g.id}">${likeLabel}</span></div><h1 class="title">${g.name}</h1></div></div></div></div>`;
}

function mkHeader(title, imgSrc, pill) {
    return `<div class="section-header"><div class="header-content">${imgSrc?`<img src="${imgSrc}" class="header-img">`:''}
        <div class="header-overlay"></div>
        <div class="header-badge"><span class="header-title">${title}</span>${pill?`<span class="header-pill">${pill}</span>`:''}</div>
    </div></div>`;
}

function renderAll() {
    const q = currentSearch.toLowerCase().trim();
    const genre = currentGenre;
    let html = '';

    if (q) {
        const res = GAMES.filter(g => g.name.toLowerCase().includes(q) || g.genres.some(gn=>gn.includes(q)));
        html = res.length
            ? `<div class="grid-3 anim-section">${res.map(g=>mkCard(g,'g3-card')).join('')}</div>`
            : `<div class="empty-state anim-section"><div class="empty-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg></div><p>No results for <strong style="color:#fff">"${q}"</strong></p></div>`;
        document.getElementById('content').innerHTML = html;
        return;
    }

    if (genre !== 'all') {
        const res = GAMES.filter(g=>g.genres.includes(genre));
        const meta = GENRE_META[genre];
        html = `<div class="genre-view-header anim-section"><div class="genre-view-icon-wrap"><img src="https://i.imgur.com/89sJzAy.png" style="width:28px;height:28px;object-fit:contain;opacity:0.9;" onerror="this.style.display='none'"></div><div><div class="genre-view-title">${meta.l}</div><div class="genre-view-count">${res.length} game${res.length!==1?'s':''}</div></div></div>`;
        html += res.length
            ? `<div class="grid-3 anim-section">${res.map(g=>mkCard(g,'genre-card')).join('')}</div>`
            : `<div class="empty-state anim-section"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#33334a" stroke-width="1.5" stroke-linecap="round">${meta.svg}</svg></div><p>No ${meta.l} games yet</p></div>`;
        document.getElementById('content').innerHTML = html;
        return;
    }

    const allByLikes = [...GAMES].sort((a,b)=>(likesCounts[b.id]||0)-(likesCounts[a.id]||0));
    const topGameId  = allByLikes[0]?.id;
    const fyHero = allByLikes[0];
    const fyRest = allByLikes.filter(g=>g.id!==fyHero.id);
    html += `<div class="section anim-section">${mkHeader('For You','https://img.itch.zone/aW1nLzE5OTMwNzM2LnBuZw==/original/9xRpPp.png','Popular')}<div class="grid-foryou">${mkCard(fyHero,'hero-left',true)}${fyRest.slice(0,4).map(g=>mkCard(g,'small',g.id===topGameId)).join('')}</div></div>`;

    if (recentlyPlayed.length) {
        const recG = recentlyPlayed.map(id=>GAMES.find(g=>g.id===id)).filter(Boolean);
        html += `<div class="section anim-section">${mkHeader('Recently Played',null,null)}<div class="grid-4">${recG.map(g=>mkCard(g,'g4-card',g.id===topGameId)).join('')}</div></div>`;
    }

    const shuffled = [...GAMES].sort(()=>Math.random()-0.5);
    const wideAt = new Set([0,7,14]), tallAt = new Set([3,10,17]);
    const allCards = shuffled.map((g,i) => {
        if (wideAt.has(i%18)) return mkCard(g,'wide-card',g.id===topGameId);
        if (tallAt.has(i%18)) return mkCard(g,'tall-card',g.id===topGameId);
        return mkCard(g,'g3-card',g.id===topGameId);
    }).join('');
    html += `<div class="section anim-section">${mkHeader('All Games',null,null)}<div class="grid-mixed">${allCards}</div></div>`;

    document.getElementById('content').innerHTML = html;
}

window.handleSearch  = v => { currentSearch = v; renderAll(); };
window.renderAll     = renderAll;
window.setGenre      = (g, el) => {
    currentGenre = g;
    document.querySelectorAll('.genre-item').forEach(i=>i.classList.remove('active'));
    el.classList.add('active');
    renderAll();
};
window.toggleSidebar = () => {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('collapsed');
    sidebar.closest('.left-col').style.width = sidebar.classList.contains('collapsed') ? 'var(--sidebar-col)' : 'var(--sidebar-w)';
};

const announceRef = doc(db,'admin','board');
onSnapshot(announceRef, snap => {
    const box = document.getElementById('announce-box');
    const msgEl = document.getElementById('announce-msg');
    const pollEl = document.getElementById('poll-options');
    if (!snap.exists() || !snap.data().active) { box.style.display='none'; return; }
    const data = snap.data();
    box.style.display = 'block';
    msgEl.textContent = data.message || '';
    pollEl.innerHTML = '';
    if (data.type==='poll' && data.options?.length) {
        const VOTE_KEY = 'poll_vote_'+(data.id||'default');
        const myVote = localStorage.getItem(VOTE_KEY);
        const totals = data.options.map((_,i)=>data.votes?.[i]||0);
        const total = totals.reduce((a,b)=>a+b,0)||1;
        data.options.forEach((opt,i) => {
            const pct = Math.round((totals[i]/total)*100);
            const btn = document.createElement('button');
            btn.className = 'poll-btn'+(myVote!==null?' voted':'');
            btn.innerHTML = `<div class="poll-bar" style="width:${pct}%"></div><div class="poll-btn-label"><span>${opt}</span><span class="poll-pct">${pct}% <span style="opacity:0.55;font-weight:500">(${totals[i]})</span></span></div>`;
            if (myVote===null) btn.onclick = async () => { localStorage.setItem(VOTE_KEY,String(i)); try { await updateDoc(announceRef,{[`votes.${i}`]:increment(1)}); } catch(e){} };
            pollEl.appendChild(btn);
        });
    }
});

setTimeout(()=>{ const f=document.getElementById('site-footer'); if(f) f.style.opacity='1'; }, 1800);
</script>
